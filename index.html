<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/fav.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neesoft</title>
    <style>
      .app-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #080808;
        opacity: 1;
        transition: opacity 300ms ease;
      }

      .app-loader-hidden {
        opacity: 0;
        pointer-events: none;
      }

      .app-loader-content {
        display: grid;
        justify-items: center;
        gap: 18px;
      }

      .app-loader-mark {
        position: relative;
        display: grid;
        width: 120px;
        height: 120px;
        place-items: center;
      }

      .app-loader-logo {
        width: 76px;
        height: 76px;
        object-fit: contain;
      }

      .app-loader-spinner {
        position: absolute;
        inset: 0;
        border: 3px solid rgb(255 126 0 / 24%);
        border-top-color: #ff7e00;
        border-radius: 50%;
        animation: app-loader-spin 900ms linear infinite;
      }

      .app-loader-label {
        color: #fff;
        font-family: Arial, sans-serif;
        font-size: 14px;
        letter-spacing: 0.08em;
      }

      @keyframes app-loader-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .app-loader-spinner {
          animation-duration: 2.5s;
        }
      }
    </style>
  </head>
  <body>
    <div id="app-loader" class="app-loader" role="status" aria-label="Loading Neesoft">
      <div class="app-loader-content">
        <div class="app-loader-mark">
          <img class="app-loader-logo" src="/fav.png" alt="" width="76" height="76" />
          <span class="app-loader-spinner" aria-hidden="true"></span>
        </div>
        <span class="app-loader-label">Loading...</span>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
